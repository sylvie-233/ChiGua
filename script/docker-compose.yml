version: "3.9"

name: chigua

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sylvie233
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: chigua
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - chigua-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sylvie233 -d chigua"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      # API 端口（后端上传文件用这个）
      - "9000:9000"
      # 控制台 Web 端口（浏览器管理文件用）
      - "9001:9001"
    environment:
      # 登录密钥（后端代码里填这两个）
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio123456
      # 开启控制台端口
      MINIO_CONSOLE_ADDRESS: :9001
    volumes:
      # 数据持久化（重启不丢文件）
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - chigua-net
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../chigua-backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes: 
      - backend-logs:/app/logs
    networks:
      - chigua-net
  frontend:
    build:
      context: ../chigua-frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - chigua-net

  admin:
    build:
      context: ../chigua-admin
      dockerfile: Dockerfile
    container_name: admin
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - chigua-net

volumes:
  pgdata:
    driver: local
  backend-logs:
    driver: local
  minio-data:
    driver: local

networks:
  chigua-net:
    driver: bridge